name: public-surface
on:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: astrozi-ai/.github
          path: .public-surface-tools
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun .public-surface-tools/scripts/public-surface/check.ts
